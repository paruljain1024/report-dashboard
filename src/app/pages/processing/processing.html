<div class="page-container">

  <div *ngIf="showSuccess" class="success-popup">
    Success: {{ successMessage }}
  </div>

  <div *ngIf="showError" class="error-popup">
    {{ errorMessage }}
  </div>

  <h2 class="page-title">Log Processing Dashboard</h2>

  <div class="card center-card">
    <div class="user-row">
      <div class="user-label-box">
        User
      </div>

      <input
        type="text"
        [(ngModel)]="currentUser"
        placeholder="Enter username"
        class="user-input"
      />

      <button
        class="enter-btn"
        (click)="confirmUser()">
        Enter
      </button>
    </div>

    <button
      class="primary-btn large-btn"
      [disabled]="!userConfirmed || processing || completed"
      [class.disabled-btn]="!userConfirmed || processing || completed"
      (click)="startProcessing()">
      Process Logs
    </button>

    <div *ngIf="hasStarted" class="status">
      <p class="status-line">
        Status: {{ statusText }}
      </p>

      <p *ngIf="hasError && errorMessage" class="error-text">
        {{ errorMessage }}
      </p>

      <div *ngIf="processing">
        <p>Processing logs...</p>

        <div class="progress-container">
          <div
            class="progress-bar"
            [style.width]="progress + '%'">
            {{ progress }}%
          </div>
        </div>

        <p class="speed-text">
          Processing speed: {{ speed }} lines/sec
        </p>
      </div>

      <div *ngIf="completed">
        <p class="success-text">
          Processing completed successfully!
        </p>

        <div class="progress-container">
          <div class="progress-bar" style="width:100%">
            100%
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
